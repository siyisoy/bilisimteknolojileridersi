<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Bilgisayar Sistemleri Quiz – Diş Hekimliği 1. Sınıf</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap');

  :root {
    --bg: #0f1823;
    --surface: #162030;
    --card: #1d2e42;
    --border: #2a3f58;
    --accent: #38bdf8;
    --accent2: #6366f1;
    --correct: #34d399;
    --wrong: #f87171;
    --text: #e2eaf4;
    --muted: #7a9ab8;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left h1 {
    font-family: 'Sora', sans-serif;
    font-size: clamp(15px, 2vw, 20px);
    color: var(--accent);
    letter-spacing: -0.3px;
  }

  .header-left p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .score-display {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 18px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 18px;
  }

  .score-display span { color: var(--text); font-weight: 600; }

  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }

  /* Progress bar */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .progress-label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 52px;
    text-align: right;
  }

  /* Question card */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 28px 24px;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 22px;
  }

  .q-num {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 7px;
    white-space: nowrap;
    margin-top: 2px;
  }

  .q-text {
    font-size: clamp(16px, 2vw, 18px);
    line-height: 1.55;
    font-weight: 500;
    color: var(--text);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font: 15px/1.45 'Inter', sans-serif;
    transition: border-color 0.15s, background 0.15s;
  }

  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #1a2f47;
  }

  .opt-btn .opt-letter {
    background: var(--border);
    color: var(--muted);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 7px;
    min-width: 26px;
    text-align: center;
    margin-top: 1px;
    transition: background 0.15s, color 0.15s;
  }

  .opt-btn.selected { border-color: var(--accent2); background: #1e2a4a; }
  .opt-btn.selected .opt-letter { background: var(--accent2); color: #fff; }

  .opt-btn.correct { border-color: var(--correct); background: #0d2a1f; }
  .opt-btn.correct .opt-letter { background: var(--correct); color: #0a1f14; }

  .opt-btn.wrong { border-color: var(--wrong); background: #2a1313; }
  .opt-btn.wrong .opt-letter { background: var(--wrong); color: #1a0a0a; }

  .opt-btn:disabled { cursor: default; }

  .feedback-box {
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
    margin-bottom: 20px;
  }

  .feedback-box.show { display: block; }
  .feedback-box.correct-fb { background: #0d2a1f; border: 1px solid var(--correct); color: #6ee7b7; }
  .feedback-box.wrong-fb { background: #2a1313; border: 1px solid var(--wrong); color: #fca5a5; }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    border-radius: 10px;
    color: #fff;
    font: 600 15px 'Inter', sans-serif;
    padding: 11px 24px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }

  .skip-btn {
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font: 14px 'Inter', sans-serif;
    padding: 10px 18px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .skip-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Results screen */
  #results-screen {
    display: none;
    text-align: center;
  }

  .results-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 48px 32px;
    max-width: 580px;
    margin: 0 auto;
  }

  .score-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) 0%, var(--accent2) var(--pct, 0%), var(--border) var(--pct, 0%));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-family: 'Sora', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    position: relative;
  }

  .score-circle::before {
    content: '';
    position: absolute;
    inset: 10px;
    background: var(--card);
    border-radius: 50%;
  }

  .score-circle span { position: relative; z-index: 1; }

  .results-card h2 {
    font-family: 'Sora', sans-serif;
    font-size: 24px;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .results-card p { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 8px; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 28px 0;
  }

  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 8px;
  }

  .stat-box .val {
    font-family: 'Sora', sans-serif;
    font-size: 24px;
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }

  .stat-box .lbl { font-size: 12px; color: var(--muted); }
  .stat-box .val.green { color: var(--correct); }
  .stat-box .val.red { color: var(--wrong); }
  .stat-box .val.blue { color: var(--accent); }

  .restart-btn {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    border-radius: 10px;
    color: #fff;
    font: 600 16px 'Sora', sans-serif;
    padding: 14px 36px;
    cursor: pointer;
    margin-top: 8px;
  }

  .restart-btn:hover { opacity: 0.88; }

  @media (max-width: 560px) {
    main { padding: 24px 16px 80px; }
    .question-card { padding: 20px 16px; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    header { padding: 14px 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Bilgisayar Sistemleri Quiz</h1>
    <p>Diş Hekimliği 1. Sınıf &nbsp;·&nbsp; 50 Soru</p>
  </div>
  <div class="score-display">
    Doğru: <span id="hdr-correct">0</span> &nbsp;|&nbsp; Yanlış: <span id="hdr-wrong">0</span>
  </div>
</header>

<main>
  <!-- Quiz screen -->
  <div id="quiz-screen">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:2%"></div></div>
      <div class="progress-label" id="prog-label">1 / 50</div>
    </div>

    <div class="question-card" id="q-card">
      <div class="q-header">
        <div class="q-num" id="q-num">S 1</div>
        <div class="q-text" id="q-text"></div>
      </div>
      <div class="options" id="options"></div>
      <div class="feedback-box" id="feedback"></div>
      <div class="card-footer">
        <button class="skip-btn" id="skip-btn">Atla →</button>
        <button class="btn-primary" id="next-btn" disabled>Sonraki Soru →</button>
      </div>
    </div>
  </div>

  <!-- Results screen -->
  <div id="results-screen">
    <div class="results-card">
      <div class="score-circle" id="score-circle"><span id="score-pct">0%</span></div>
      <h2 id="result-title">Quiz Tamamlandı!</h2>
      <p id="result-msg"></p>
      <div class="stats-row">
        <div class="stat-box"><span class="val green" id="res-correct">0</span><span class="lbl">Doğru</span></div>
        <div class="stat-box"><span class="val red" id="res-wrong">0</span><span class="lbl">Yanlış</span></div>
        <div class="stat-box"><span class="val blue" id="res-skipped">0</span><span class="lbl">Atlanan</span></div>
      </div>
      <button class="restart-btn" onclick="restart()">Tekrar Başla</button>
    </div>
  </div>
</main>

<script>
const QUESTIONS = [
  // 1 — Donanım
  {
    q: "Bir bilgisayarda o anda çalışan programların geçici verileri ağırlıklı olarak nerede tutulur?",
    opts: ["SSD/HDD gibi depolama birimi","RAM (geçici bellek)","Anakart","Güç kaynağı"],
    ans: 1,
    exp: "RAM, çalışan programların anlık verilerini tutar; SSD/HDD ise kalıcı dosya depolama birimidir."
  },
  {
    q: "Kaydedilmiş bir diş hekimliği ödevi dosyası normalde hangi birimde saklanır?",
    opts: ["RAM","CPU önbelleği","SSD veya HDD","Anakart çipi"],
    ans: 2,
    exp: "Kalıcı dosyalar SSD veya HDD gibi depolama birimlerinde tutulur; RAM yalnızca geçici çalışma alanıdır."
  },
  {
    q: "Anakartın temel işlevi nedir?",
    opts: ["Komutları yürütmek","Bileşenler arasındaki bağlantı altyapısını sağlamak","Dosyaları kalıcı olarak depolamak","Görüntüyü ekrana aktarmak"],
    ans: 1,
    exp: "Anakart; CPU, RAM, depolama ve diğer bileşenlerin birbirine bağlandığı merkezi altyapıdır."
  },
  {
    q: "Daha büyük bir depolama birimi her zaman bilgisayarı daha hızlı yapar mı?",
    opts: ["Evet, kapasite arttıkça hız da artar","Hayır; hız CPU, RAM, iş yükü ve depolama hızına birlikte bağlıdır","Evet, ancak yalnızca SSD kullanılırsa","Hayır, hız yalnızca CPU'ya bağlıdır"],
    ans: 1,
    exp: "Kapasite ile hız aynı şey değildir. Genel performans CPU, RAM miktarı, depolama hızı ve çalışan uygulamaların birleşimine bağlıdır."
  },
  {
    q: "Aşağıdakilerden hangisi bir giriş/çıkış aygıtına örnektir?",
    opts: ["RAM","CPU","Klavye ve fare","SSD"],
    ans: 2,
    exp: "Klavye ve fare giriş; ekran ve yazıcı ise çıkış aygıtlarıdır. CPU ve RAM giriş/çıkış bileşeni değildir."
  },
  // 6 — İşletim sistemi
  {
    q: "İşletim sisteminin temel görevi nedir?",
    opts: ["Yalnızca internet bağlantısı sağlamak","İşlemci, bellek, dosya ve aygıt erişimini yönetmek","Doküman oluşturmak","Donanımı üretmek"],
    ans: 1,
    exp: "İşletim sistemi; donanım kaynaklarını (CPU, bellek, aygıtlar) yönetir ve uygulamaların çalışabileceği ortamı sağlar."
  },
  {
    q: "Aşağıdakilerden hangisi 'çekirdek' (kernel) katmanının doğru açıklamasıdır?",
    opts: ["Kullanıcının gördüğü grafik arayüz","İşletim sisteminin kaynakları yöneten temel bileşeni","Bir internet tarayıcısı","Bir ofis uygulaması"],
    ans: 1,
    exp: "Çekirdek, işletim sisteminin donanım kaynaklarını yöneten temel yazılım katmanıdır; kullanıcı arayüzünden bağımsızdır."
  },
  {
    q: "LibreOffice Writer veya Microsoft Word hangi yazılım katmanında yer alır?",
    opts: ["Donanım","Çekirdek (kernel)","Uygulama katmanı","Ağ protokolü"],
    ans: 2,
    exp: "Writer ve Word birer ofis uygulamasıdır; kullanıcı görevlerini yerine getiren uygulama katmanında çalışır."
  },
  {
    q: "Masaüstü işletim sistemleri ile sunucu işletim sistemleri arasındaki temel fark nedir?",
    opts: ["Sunucu sistemleri daha ucuzdur","Masaüstü sistemleri kişisel etkileşime, sunucu sistemleri diğer cihazlara hizmet sunmaya odaklanır","Masaüstü sistemleri daha güçlü işlemciye sahiptir","Sunucu sistemlerinde grafik arayüz zorunludur"],
    ans: 1,
    exp: "Masaüstü sistemleri bireysel kullanıcı etkileşimi için, sunucu sistemleri ise ağ üzerinden sürekli hizmet sunmak için tasarlanmıştır."
  },
  {
    q: "Android işletim sisteminin altında hangi çekirdek kullanılır?",
    opts: ["Windows NT","macOS Darwin","Linux çekirdeği","FreeBSD çekirdeği"],
    ans: 2,
    exp: "Android, Linux çekirdeğini temel alır; ancak bu, tüm masaüstü Linux uygulamalarının doğrudan çalışacağı anlamına gelmez."
  },
  // 11 — Sistem aileleri
  {
    q: "Android'de Linux çekirdeği bulunması, tüm masaüstü Linux uygulamalarının Android'de doğrudan çalıştığını kanıtlar mı?",
    opts: ["Evet, aynı çekirdek kullanıldığı için çalışır","Hayır; kullanıcı alanı kütüphaneleri ve arayüzler birbirinden farklıdır","Evet, ancak yalnızca komut satırı uygulamaları için","Hayır, çünkü Android'in hiç çekirdeği yoktur"],
    ans: 1,
    exp: "Aynı çekirdek farklı kullanıcı alanı yazılım yığınlarını destekleyebilir. Android ve masaüstü Linux çok farklı uygulama ortamlarına sahiptir."
  },
  {
    q: "macOS işletim sisteminin tarihsel kökeni hangi sistemle ilişkilidir?",
    opts: ["Windows NT","Linux çekirdeği","BSD ve Mach bileşenleri","MS-DOS"],
    ans: 2,
    exp: "macOS/Darwin, BSD ve Mach mikroçekirdeği gibi bileşenlerle ilişkilidir; tamamen bağımsız bir UNIX türevidir."
  },
  {
    q: "Bir Linux dağıtımı (distribution) nedir?",
    opts: ["Yalnızca Linux çekirdeğinin kendisi","Çekirdek, araçlar, paket yöneticisi ve masaüstü gibi bileşenlerin birleşimi","Linux'un ücretli sürümü","Yalnızca sunucu için tasarlanmış bir sistem"],
    ans: 1,
    exp: "Ubuntu, Fedora, Debian gibi dağıtımlar; çekirdek ile birlikte araçlar, paket yöneticisi ve genellikle bir masaüstü ortamını bir arada sunar."
  },
  {
    q: "Fedora dağıtımında KDE Plasma ne anlama gelir?",
    opts: ["Fedora'nın başka bir adı","Fedora'nın içindeki masaüstü ortamı","Fedora'nın kurumsal sürümü","Bir Linux çekirdeği sürümü"],
    ans: 1,
    exp: "Fedora bir dağıtım, KDE Plasma ise o dağıtım üzerinde çalışan masaüstü ortamıdır. Masaüstü değişirse sistem ailesi değişmez."
  },
  {
    q: "ChromeOS ve Chrome tarayıcısı arasındaki fark nedir?",
    opts: ["İkisi de tamamen aynı şeydir","ChromeOS Chromebook'larda çalışan bir işletim sistemidir; Chrome ise farklı platformlarda çalışan tarayıcıdır","Chrome yalnızca ChromeOS'ta çalışır","ChromeOS Windows'un bir sürümüdür"],
    ans: 1,
    exp: "ChromeOS Google'ın Chromebook cihazlarına özgü web odaklı işletim sistemidir; Chrome tarayıcısı ise Windows, macOS ve Linux'ta da çalışır."
  },
  // 16 — Özel sistemler
  {
    q: "Gömülü sistem (embedded system) nedir?",
    opts: ["İnternetin içinde çalışan bir sistem","Daha büyük bir ürünün içinde belirli görevleri yerine getiren bilgisayar sistemi","Yalnızca akıllı telefonlarda kullanılan sistem","Süper bilgisayar türü"],
    ans: 1,
    exp: "Gömülü sistem; bir cihazın (örneğin dijital röntgen cihazı, otoklav kontrol paneli) içinde tanımlı görevler için tasarlanmış bilgisayar sistemidir."
  },
  {
    q: "RTOS (Gerçek Zamanlı İşletim Sistemi) nedir?",
    opts: ["Yalnızca hızlı hesaplamalar yapan sistem","Gereken yanıtı belirlenmiş süre içinde öngörülebilir şekilde verebilen sistem","İnternete bağlı her işletim sistemi","Grafik arayüze sahip gömülü sistem"],
    ans: 1,
    exp: "RTOS'un odağı yalnızca hız değil, öngörülebilir zamanlama ve belirlenmiş süre sınırına uyabilme yeteneğidir."
  },
  {
    q: "'Hard real-time' ve 'soft real-time' sistemler arasındaki fark nedir?",
    opts: ["Hard real-time daha yavaştır","Hard real-time'da süre sınırını kaçırmak kabul edilemez hata doğurabilir; soft real-time'da gecikme kaliteyi bozar ama felaket değildir","Soft real-time yalnızca gömülü sistemlerde kullanılır","İkisi arasında fark yoktur"],
    ans: 1,
    exp: "Kalp pili gibi hard real-time sistemlerde süre sınırını kaçırmak yaşamsal hata olabilir; video oynatma gibi soft real-time'da gecikmeler performansı düşürür ama kabul edilemez değildir."
  },
  {
    q: "Gömülü sistemle RTOS kavramı arasındaki temel fark nedir?",
    opts: ["Gömülü sistemler her zaman RTOS kullanmak zorundadır","Gömülü sistem bağlamı (ürünün içindeki görev) tanımlar; RTOS zamanlama gereksinimini tanımlar","RTOS gömülü sistemlerin daha hızlı çalışan adıdır","Fark yoktur; aynı kavramlardır"],
    ans: 1,
    exp: "Gömülü sistem bir ürün içindeki kullanım bağlamını, RTOS ise yanıtın ne kadar öngörülebilir olması gerektiğini tanımlar. Gömülü sistem RTOS gerektirmeyebilir."
  },
  {
    q: "Süper bilgisayar ile web sunucusu arasındaki temel fark nedir?",
    opts: ["Web sunucuları daha pahalıdır","Süper bilgisayar büyük hesaplama işleri için yüksek toplam performansı hedefler; web sunucusu diğer cihazlara hizmet verme rolü üstlenir","İkisi de aynı işlevi görür","Süper bilgisayarlarda işletim sistemi olmaz"],
    ans: 1,
    exp: "Her web sunucusu süper bilgisayar değildir. Süper bilgisayar iklim modellemesi gibi devasa hesaplamalar için kullanılırken web sunucusu istemcilere hizmet odaklıdır."
  },
  // 21 — Sanallaştırma
  {
    q: "Sanallaştırma ortamında 'host OS' ne anlama gelir?",
    opts: ["Sanal makine içinde çalışan ikinci işletim sistemi","Fiziksel bilgisayarda çalışan ve sanal makine yazılımına ortam sağlayan sistem","Ağ üzerinden bağlanılan uzak sunucu","Sanal donanımı oluşturan yazılım"],
    ans: 1,
    exp: "Host OS, fiziksel makinede kurulu olan ve VirtualBox gibi sanallaştırma aracını çalıştıran asıl işletim sistemidir."
  },
  {
    q: "Sanallaştırma ortamında 'guest OS' ne anlama gelir?",
    opts: ["Fiziksel makinedeki asıl işletim sistemi","Sanal makine içinde çalışan ikinci işletim sistemi","Ağ bağdaştırıcısı yazılımı","Sanallaştırma aracının kendisi"],
    ans: 1,
    exp: "Guest OS (konuk sistem), sanal makine içinde çalışan işletim sistemidir. Örnek: Windows içinde VirtualBox aracılığıyla çalışan Ubuntu."
  },
  {

let current = 0;
let correct = 0;
let wrong = 0;
let skipped = 0;
let answered = false;

function render() {
  const q = QUESTIONS[current];
  document.getElementById('q-num').textContent = 'S ' + (current + 1);
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-label').textContent = (current + 1) + ' / ' + QUESTIONS.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / QUESTIONS.length * 100) + '%';

  const optDiv = document.getElementById('options');
  optDiv.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = '<span class="opt-letter">' + letters[i] + '</span><span>' + o + '</span>';
    btn.onclick = () => select(i);
    optDiv.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback-box';
  fb.textContent = '';

  document.getElementById('next-btn').disabled = true;
  document.getElementById('skip-btn').disabled = false;
  answered = false;
}

function select(idx) {
  if (answered) return;
  answered = true;

  const q = QUESTIONS[current];
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.ans) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if (idx === q.ans) {
    correct++;
    fb.className = 'feedback-box correct-fb show';
    fb.textContent = '✓ Doğru! ' + q.exp;
  } else {
    wrong++;
    fb.className = 'feedback-box wrong-fb show';
    fb.textContent = '✗ Yanlış. Doğru cevap: ' + q.opts[q.ans] + '. ' + q.exp;
  }

  document.getElementById('skip-btn').disabled = true;
  document.getElementById('next-btn').disabled = false;
  updateHeader();
}

function updateHeader() {
  document.getElementById('hdr-correct').textContent = correct;
  document.getElementById('hdr-wrong').textContent = wrong;
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current >= QUESTIONS.length) showResults();
  else render();
};

document.getElementById('skip-btn').onclick = () => {
  if (answered) return;
  skipped++;
  current++;
  if (current >= QUESTIONS.length) showResults();
  else render();
};

function showResults() {
  document.getElementById('quiz-screen').style.display = 'none';
  const res = document.getElementById('results-screen');
  res.style.display = 'block';

  const pct = Math.round(correct / QUESTIONS.length * 100);
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-circle').style.setProperty('--pct', pct + '%');

  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-skipped').textContent = skipped;

  let title, msg;
  if (pct >= 90) { title = 'Mükemmel! 🎉'; msg = 'Tebrikler! Konuyu çok iyi kavradınız.'; }
  else if (pct >= 70) { title = 'İyi İş! 👏'; msg = 'Konuyu genel olarak iyi kavramışsınız. Eksik kalan bölümleri gözden geçirin.'; }
  else if (pct >= 50) { title = 'Geçer Puan ✓'; msg = 'Temel kavramları öğrendiniz ancak bazı bölümleri pekiştirmeniz önerilir.'; }
  else { title = 'Tekrar Çalışın 📚'; msg = 'Konuyu tekrar gözden geçirip quiz\'i yeniden deneyin.'; }

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-msg').textContent = msg;
}

function restart() {
  current = 0; correct = 0; wrong = 0; skipped = 0; answered = false;
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  updateHeader();
  render();
}

render();
